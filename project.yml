name: Pastille
options:
  bundleIdPrefix: dev.pastille
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

targets:
  Pastille:
    type: application
    platform: macOS
    sources:
      - Pastille
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Pastille/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pastille/Resources/Pastille.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.pastille.Pastille
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: false
        SWIFT_STRICT_CONCURRENCY: complete
